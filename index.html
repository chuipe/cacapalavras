<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encontre peças do motor escondidas no caça-palavras.">
  <title>CaçaPalavras</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <main class="app" id="main-content">
    <header class="app-header">
      <p class="eyebrow">Desafio diário</p>
      <h1>CaçaPalavras</h1>
      <p class="tagline">Encontre todas as palavras escondidas!</p>
    </header>

    <section class="panel" aria-labelledby="words-title">
      <div class="section-heading">
        <h2 id="words-title">Palavras para encontrar</h2>
        <p id="found-count" class="found-count"></p>
      </div>
      <ul class="word-list" id="word-list" aria-label="Palavras do desafio"></ul>
    </section>

    <section class="game-panel" aria-labelledby="grid-title">
      <h2 id="grid-title" class="sr-only">Grade do caça-palavras</h2>
      <p class="instructions">Arraste sobre as letras ou toque na primeira e na última letra.</p>
      <div class="word-grid" id="word-grid" role="group" aria-label="Grade de letras do caça-palavras"></div>
      <p id="game-status" class="game-status" aria-live="polite">Selecione uma palavra para começar.</p>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
